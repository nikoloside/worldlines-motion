[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldlines-motion"
version = "0.1.0"
description = "Character motion experiments and SMPL-X interface for Worldlines"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0", "smplx>=0.1.28", "Pillow>=10"]

[tool.setuptools]
py-modules = ["smplx_bridge", "preview_clips"]
